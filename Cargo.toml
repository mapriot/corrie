[package]
name = "corrie"
version = "0.1.0"
edition = "2021"
description = "Fast DEM-to-contour vector tile generator (PMTiles / MBTiles)"
license = "MIT"
repository = "https://github.com/mapriot/corrie"
categories = ["command-line-utilities", "science::geo"]
readme = "README.md"

[[bin]]
name = "corrie"
path = "src/main.rs"

[dependencies]
gdal = "0.19"
rayon = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
prost = "0.13"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rstar = { version = "0.12", features = ["serde"] }
memmap2 = "0.9"
sha2 = "0.10"
bincode = "1"
hilbert_2d = "1"
bytemuck = { version = "1", features = ["derive"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Pure-Rust shapefile crate, used by integration tests to write fixture
# SHPs. Runtime SHP reading goes through GDAL/OGR (see src/shapefile_read.rs).
shapefile = "0.6"
tokio = { version = "1", features = ["rt", "macros"] }
pmtiles = { version = "0.21", features = ["mmap-async-tokio"] }
