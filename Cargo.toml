[package]
name = "corrie"
version = "0.1.0"
edition = "2021"
description = "Fast DEM-to-contour vector tile generator (PMTiles / MBTiles)"
license = "MIT"
repository = "https://github.com/mapriot/corrie"
categories = ["command-line-utilities", "science::geo"]
readme = "README.md"

[[bin]]
name = "corrie"
path = "src/main.rs"

[dependencies]
gdal = "0.19"
rayon = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
pmtiles = { version = "0.21", features = ["write"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
prost = "0.13"
flate2 = "1"
