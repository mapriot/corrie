[package]
name = "corrie"
version = "0.5.1"
edition = "2021"
description = "Fast contour vector tiles: contour lines or a DEM to clustered PMTiles, built for world-scale layers"
keywords = ["contours", "pmtiles", "vector-tiles", "gdal", "gis"]
license = "MIT"
repository = "https://github.com/mapriot/corrie"
categories = ["command-line-utilities", "science::geo"]
readme = "README.md"
exclude = [".github/", "Dockerfile", ".dockerignore"]

[[bin]]
name = "corrie"
path = "src/main.rs"

[dependencies]
gdal = "0.19"
rayon = "1"
rusqlite = "0.39"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
prost = "0.13"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
sha2 = "0.10"
bytemuck = { version = "1", features = ["derive"] }
tempfile = "3"
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Pure-Rust shapefile crate, used by integration tests to write fixture
# SHPs. Runtime SHP reading goes through GDAL/OGR (see src/shapefile_read.rs).
shapefile = "0.6"
tokio = { version = "1", features = ["rt", "macros"] }
pmtiles = { version = "0.21", features = ["mmap-async-tokio"] }
